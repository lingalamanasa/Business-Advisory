<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Strategic Route Not Found | Stackly Business Advisory</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
  <style>
    :root {
      --primary-green: #eab308;
      --primary-dark: #18181b;
      --accent-gold: #c5a059;
      --bg-cream: #f7fbf5;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #ffffff 0%, #f4f4f5 60%, #e4e4e7 100%);
      min-height: 100vh;
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #1a1a1a;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    
    /* Ambient Animated 3D Orbs */
    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      z-index: 0;
      pointer-events: none;
      animation: floatOrb 12s ease-in-out infinite alternate;
    }
    .orb-1 { width: 380px; height: 380px; background: rgba(234, 179, 8, 0.22); top: 5%; left: 8%; }
    .orb-2 { width: 450px; height: 450px; background: rgba(197, 160, 89, 0.18); bottom: 10%; right: 8%; animation-delay: -4s; }
    .orb-3 { width: 300px; height: 300px; background: rgba(46, 74, 25, 0.15); top: 50%; left: 65%; animation-delay: -7s; }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, -30px) scale(1.1); }
      100% { transform: translate(-30px, 30px) scale(0.95); }
    }

    /* 404 Main Stage */
    .error-wrapper {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      text-align: center;
      perspective: 1200px;
    }

    .error-header-logo {
      margin-bottom: 2rem;
    }
    .nav-logo-img {
      max-height: 52px;
      width: auto;
      object-fit: contain;
    }

    .scene-3d {
      position: relative;
      width: 100%;
      max-width: 680px;
      padding: 2.5rem 1.5rem;
      transform-style: preserve-3d;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Floating 3D Icons */
    .floating-item {
      position: absolute;
      font-size: 2.8rem;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.15));
      animation: floatPhysics 6s ease-in-out infinite;
      z-index: 5;
    }

    .item-strategy { top: 0%; left: 6%; color: #000000; animation-duration: 5.5s; animation-delay: 0s; }
    .item-deals { top: 15%; right: 4%; color: #1976d2; animation-duration: 6.2s; animation-delay: -1.5s; }
    .item-chart { bottom: 25%; left: 4%; color: #e65100; animation-duration: 7s; animation-delay: -3s; }
    .item-shield { bottom: 8%; right: 8%; color: #0288d1; animation-duration: 5.8s; animation-delay: -2.2s; }
    .item-target { top: -8%; right: 28%; color: #7b1fa2; animation-duration: 6.5s; animation-delay: -4s; }
    .item-handshake { bottom: -5%; left: 32%; color: var(--primary-green); animation-duration: 5s; animation-delay: -1s; }

    @keyframes floatPhysics {
      0%, 100% {
        transform: translateY(0px) rotate(0deg) translateZ(30px);
      }
      50% {
        transform: translateY(-22px) rotate(12deg) translateZ(60px);
      }
    }

    /* 3D Giant 404 Text */
    .glitch-404 {
      font-size: clamp(6.5rem, 16vw, 13rem);
      font-weight: 900;
      line-height: 0.95;
      margin: 0;
      letter-spacing: -4px;
      background: linear-gradient(135deg, #000000 0%, #18181b 40%, #eab308 75%, #facc15 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 20px 40px rgba(234, 179, 8, 0.25);
      position: relative;
      display: inline-block;
      user-select: none;
      animation: breathe3D 4s ease-in-out infinite;
    }

    @keyframes breathe3D {
      0%, 100% {
        transform: translateZ(50px) scale(1);
      }
      50% {
        transform: translateZ(80px) scale(1.03);
      }
    }

    /* Content Card */
    .card-content {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(234, 179, 8, 0.3);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0,0,0,0.05);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      margin-top: 1.5rem;
      transform: translateZ(40px);
    }

    .badge-404 {
      background: rgba(234, 179, 8, 0.15);
      color: #a16207;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      padding: 0.4rem 1.2rem;
      border-radius: 30px;
      text-transform: uppercase;
      display: inline-block;
      margin-bottom: 1.2rem;
      border: 1px solid rgba(234, 179, 8, 0.3);
    }

    .error-title {
      font-size: clamp(1.6rem, 3.5vw, 2.4rem);
      font-weight: 800;
      color: #000000;
      margin-bottom: 2rem;
      line-height: 1.25;
    }

    .error-desc {
      max-width: 480px;
      margin: 0 auto 2rem;
      font-size: 1.05rem;
      color: #52525b;
      line-height: 1.65;
    }

    /* Actions */
    .action-buttons {
      display: flex;
      gap: 1.2rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 0;
    }

    .btn-action-primary {
      background: #eab308;
      color: #000000;
      padding: 0.9rem 2.2rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      box-shadow: 0 10px 22px rgba(234, 179, 8, 0.35);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      border: none;
      cursor: pointer;
    }
    .btn-action-primary:hover {
      background: #ca8a04;
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 16px 30px rgba(234, 179, 8, 0.45);
    }

    .btn-action-outline {
      background: rgba(255, 255, 255, 0.9);
      color: #18181b;
      border: 2px solid #eab308;
      padding: 0.85rem 2rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: pointer;
    }
    .btn-action-outline:hover {
      background: #eab308;
      color: #ffffff;
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(234, 179, 8, 0.25);
    }

    .error-footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #7c9274;
    }
  </style>
</head>
<body>

  <!-- Background Orbs -->
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>
  <div class="ambient-orb orb-3"></div>

  <main class="error-wrapper">

    <!-- Top Logo -->
    <div class="error-header-logo" data-aos="fade-down">
      <a href="index.html" class="nav-logo"><img src="images/logo-dark.webp" alt="STACKLY Logo" class="nav-logo-img" /></a>
    </div>

    <!-- 3D Interactive Stage -->
    <div class="scene-3d" id="motionScene">

      <!-- Floating 3D Business Advisory Elements -->
      <div class="floating-item item-strategy" title="Corporate Strategy">
        <i class="fa-solid fa-chess-knight"></i>
      </div>
      <div class="floating-item item-deals" title="M&A Deal Advisory">
        <i class="fa-solid fa-handshake"></i>
      </div>
      <div class="floating-item item-target" title="Target Scale">
        <i class="fa-solid fa-bullseye"></i>
      </div>

      <!-- Giant 404 Headline -->
      <h1 class="glitch-404">404</h1>

      <!-- Card Container -->
      <div class="card-content" data-aos="fade-up" data-aos-delay="100">
        <h2 class="error-title">This Mandate or URL Does Not Exist</h2>

        <!-- CTAs -->
        <div class="action-buttons">
          <a href="index.html" class="btn-action-primary">
            <i class="fa-solid fa-house"></i> Return to Homepage
          </a>
          <button onclick="window.history.back()" class="btn-action-outline">
            <i class="fa-solid fa-arrow-left"></i> Previous Page
          </button>
        </div>
      </div>

    </div>

    <div class="error-footer">
      <p>&copy; 2026 Stackly Business Advisory. Confidentiality & Non-Disclosure Protected.</p>
    </div>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (typeof AOS !== 'undefined') {
        AOS.init({ duration: 900, once: true });
      }

      // 3D Parallax Tracking
      const scene = document.getElementById('motionScene');
      if (scene) {
        window.addEventListener('mousemove', (e) => {
          const x = (window.innerWidth / 2 - e.pageX) / 28;
          const y = (window.innerHeight / 2 - e.pageY) / 28;
          scene.style.transform = `rotateY(${ -x }deg) rotateX(${ y }deg)`;
        });

        // Reset on mouse leave
        document.addEventListener('mouseleave', () => {
          scene.style.transform = 'rotateY(0deg) rotateX(0deg)';
        });
      }
    });
  </script>
</body>
</html>
